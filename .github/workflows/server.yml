name: Multiplayer server

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  server:
    name: Linux server build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/Chess.Web/package-lock.json
      - name: Restore browser dependencies
        run: npm ci --prefix src/Chess.Web --ignore-scripts
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
        with:
          dotnet-version: '10.0.x'
      - name: Restore portable server tests
        run: dotnet restore src/Chess.Server.Tests/Chess.Server.Tests.csproj
      - name: Build and test server
        run: dotnet test src/Chess.Server.Tests/Chess.Server.Tests.csproj --configuration Release --no-restore -p:TreatWarningsAsErrors=true --logger trx --results-directory artifacts/server-tests
      - name: Test browser session recovery
        run: npm test --prefix src/Chess.Web
      - name: Build native connection probe
        run: dotnet build tools/Chess.Client.Smoke/Chess.Client.Smoke.csproj --configuration Release -p:TreatWarningsAsErrors=true
      - name: Install Chromium
        working-directory: src/Chess.Web
        run: npx playwright install --with-deps chromium
      - name: Build hosting container
        run: docker build --tag chess-server:ci .
      - name: Start hosting container
        run: docker run --detach --rm --name chess-server-ci --publish 5080:8080 chess-server:ci
      - name: Wait for hosting container
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5080/health; then
              exit 0
            fi
            sleep 1
          done
          docker logs chess-server-ci
          exit 1
      - name: Test browser multiplayer against hosting container
        env:
          CHESS_BASE_URL: http://127.0.0.1:5080
        run: npm run test:e2e --prefix src/Chess.Web
      - name: Show hosting container logs
        if: failure()
        run: docker logs chess-server-ci
      - name: Stop hosting container
        if: always()
        run: docker stop chess-server-ci
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: failure()
        with:
          name: browser-test-results
          path: src/Chess.Web/test-results/
          retention-days: 7
      - name: Publish Linux server
        run: dotnet publish src/Chess.Server/Chess.Server.csproj --configuration Release --runtime linux-x64 --self-contained true -p:TreatWarningsAsErrors=true --output artifacts/server
      - name: Package server
        run: tar -czf artifacts/Chess-server-linux-x64.tar.gz -C artifacts/server .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Chess-server-linux-x64
          path: artifacts/Chess-server-linux-x64.tar.gz
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: server-test-results
          path: artifacts/server-tests/*.trx
          retention-days: 14
